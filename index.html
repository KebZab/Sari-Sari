          '<div class="drawer-bottom">' +
          '<div class="sheet-handle"></div>' +
          '<div class="drawer-head"><h3>' + ICON.cart + ' Your cart</h3><button class="close-x" onclick="App.toggleCart(false)">' + ICON.close + '</button></div>' +
          '<div class="drawer-body">' + body + '</div>' +
          (cart.length > 0 ? (
            '<div class="cart-summary">' +
            '<div class="summary-row"><span>Subtotal</span><span>' + peso(total) + '</span></div>' +
            '<div class="summary-row total"><span>Total</span><span>' + peso(total) + '</span></div>' +
            '<button class="btn btn-primary btn-block" onclick="App.goCheckout()">Proceed to checkout</button>' +
            '</div>'
          ) : '') +
          '</div>' +
          '</div>';
      }

      /* ---------- Notifications Drawer ---------- */
      function renderNotifDrawer(user) {
        var items = getNotifs().filter(function (n) { return n.userId === user.id; });
        var body;
        if (items.length === 0) {
          body = '<div class="empty-state"><div class="ic">' + ICON.bell + '</div><h3>No notifications yet</h3><p>You\'ll see order updates here.</p></div>';
        } else {
          body = items.map(function (n) {
            return '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="App.readNotif(\'' + n.id + '\')">' +
              '<div class="notif-ic">' + notifIcon(n.type) + '</div>' +
              '<div><div class="notif-text">' + esc(n.message) + '</div><div class="notif-time">' + fmtDateTime(n.createdAt) + '</div></div>' +
              '</div>';
          }).join('');
        }
        // Use bottom-sheet for customer, side drawer for admin
        var isCustomer = currentUser() && currentUser().role === 'customer';
        if (isCustomer) {
          return '' +
            '<div class="overlay-bg bottom-sheet" onclick="if(event.target===this) App.toggleNotif(false)">' +
            '<div class="drawer-bottom">' +
            '<div class="sheet-handle"></div>' +
            '<div class="drawer-head"><h3>' + ICON.bell + ' Notifications</h3><button class="close-x" onclick="App.toggleNotif(false)">' + ICON.close + '</button></div>' +
            '<div class="drawer-body">' + body + '</div>' +
            '</div>' +
            '</div>';
        }
        return '' +
          '<div class="overlay-bg" onclick="if(event.target===this) App.toggleNotif(false)">' +
          '<div class="drawer">' +
          '<div class="drawer-head"><h3>' + ICON.bell + ' Notifications</h3><button class="close-x" onclick="App.toggleNotif(false)">' + ICON.close + '</button></div>' +
          '<div class="drawer-body">' + body + '</div>' +
          '</div>' +
          '</div>';
      }
      function notifIcon(type) {
        var map = { order: ICON.orders, status: ICON.truck, cancel: ICON.close, newOrder: ICON.bell, info: ICON.bell };
        return map[type] || ICON.bell;
      }

      /* ---------- Checkout ---------- */
      function renderCheckout(user) {
        var cart = getCart();
        if (cart.length === 0) {
          return '<div class="empty-state"><div class="ic">' + ICON.cart + '</div><h3>Your cart is empty</h3><p>Add products before checking out.</p><button class="btn btn-primary" style="margin-top:14px;" onclick="App.go(\'customer-home\')">Browse products</button></div>';
        }
        var total = cartTotal();
        var addrEditing = state.addressEditing;
        var addressBlock;
        if (addrEditing) {
          addressBlock = '' +
            '<div class="field"><label>Barangay</label><input id="chk-barangay" type="text" value="' + esc(user.barangay) + '"></div>' +
            '<div class="field"><label>House number / street</label><input id="chk-housestreet" type="text" value="' + esc(user.houseStreet) + '"></div>' +
            '<div class="field"><label>Nearby landmark</label><input id="chk-landmark" type="text" value="' + esc(user.landmark) + '"></div>' +
            '<div class="field"><label>Phone number</label><input id="chk-phone" type="tel" value="' + esc(user.phone) + '"></div>' +
            '<button class="btn btn-outline btn-sm" onclick="App.saveCheckoutAddress()">Save address</button>';
        } else {
          addressBlock = '' +
            '<div class="info-row"><span class="k">Name</span><span class="v">' + esc(user.fullName) + '</span></div>' +
            '<div class="info-row"><span class="k">Phone</span><span class="v">' + esc(user.phone) + '</span></div>' +
            '<div class="info-row"><span class="k">Barangay</span><span class="v">' + esc(user.barangay) + '</span></div>' +
            '<div class="info-row"><span class="k">House / street</span><span class="v">' + esc(user.houseStreet) + '</span></div>' +
            '<div class="info-row"><span class="k">Landmark</span><span class="v">' + esc(user.landmark) + '</span></div>' +
            '<button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="App.editCheckoutAddress()">' + ICON.edit + ' Edit address</button>';
        }
        var itemsHtml = cart.map(function (c) {
          var p = productById(c.productId);
          if (!p) return '';
          return '<div class="info-row"><span class="k">' + esc(p.name) + ' &times; ' + c.qty + '</span><span class="v">' + peso(p.price * c.qty) + '</span></div>';
        }).join('');
        var gpsBlock = '' +
          '<div class="section-title" style="margin-top:14px;">' + ICON.pin + ' Pinpoint location (Real-time GPS)</div>' +
          '<div class="card" style="padding:14px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<div>' +
          '<div style="font-weight:700;font-size:13.5px;">Exact Drop-off Pin</div>' +
          '<div style="font-size:11.5px;color:var(--ink-500);">Tap "Detect My GPS" or drag the pin to your gate</div>' +
          '</div>' +
          '<button type="button" class="gps-btn" id="btn-detect-gps" onclick="App.detectCustomerGps()">' +
          '<span class="gps-radar-dot"></span>' +
          '<span id="gps-btn-text">' + (state.checkoutGpsStatus === 'locked' ? 'GPS Locked ✓' : 'Detect My GPS') + '</span>' +
          '</button>' +
          '</div>' +
          '<div id="checkout-map" class="map-box checkout-map-view"></div>' +
          '<div class="gps-status-row" id="checkout-gps-status">' +
          (state.checkoutCoords ?
            (state.checkoutCoords.manual ?
              '<span class="gps-badge-pill manual">📍 Pin Set on Map</span><span>' + state.checkoutCoords.lat.toFixed(5) + ', ' + state.checkoutCoords.lng.toFixed(5) + '</span>' :
              '<span class="gps-badge-pill locked"><span class="cloud-dot"></span> GPS Locked</span><span>' + (state.checkoutCoords.accuracy ? '~' + state.checkoutCoords.accuracy + 'm accuracy' : 'High accuracy') + '</span>'
            ) :
            '<span class="gps-badge-pill searching">📍 Detect GPS or tap the map</span><span>No drop-off location selected</span>'
          ) +
          '</div>' +
          '</div>';

        return '' +
          '<div class="section-title" style="margin-top:6px;">' + ICON.pin + ' Delivery address</div>' +
          '<div class="card">' + addressBlock + '</div>' +
          gpsBlock +
          '<div class="section-title">' + ICON.package + ' Order items</div>' +
          '<div class="card">' + itemsHtml + '</div>' +
          '<div class="section-title">Delivery instructions (optional)</div>' +
          '<div class="card"><textarea id="chk-instructions" placeholder="e.g. Please call upon arrival, leave with the guard, etc.">' + esc(state.checkoutInstructions) + '</textarea></div>' +
          '<div class="section-title">' + ICON.money + ' Payment method</div>' +
          '<div class="card"><div class="info-row"><span class="k">Payment</span><span class="v">Cash on Delivery (COD)</span></div></div>' +
          '<div class="card" style="background:linear-gradient(135deg, var(--green-50), var(--surface));">' +
          '<div class="summary-row total"><span>Total to pay</span><span>' + peso(total) + '</span></div>' +
          '<button class="btn btn-primary btn-block" onclick="App.placeOrder()">' + ICON.check + ' Place order</button>' +
          '</div>';
      }

      /* ---------- Orders list / detail ---------- */
      function renderCustomerOrders(user) {
        var orders = getOrders().filter(function (o) { return o.customerId === user.id; });
        orders.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        if (orders.length === 0) {
          return '<div class="empty-state"><div class="ic">' + ICON.orders + '</div><h3>No orders yet</h3><p>Your placed orders will show up here.</p></div>';
        }
        return '<div class="section-title">Your orders</div>' + orders.map(function (o) {
          return '' +
            '<div class="order-card" onclick="App.viewOrder(\'' + o.id + '\')">' +
            '<div class="top"><div><div class="ordno">' + esc(o.orderNumber) + '</div><div class="meta">' + fmtDateTime(o.createdAt) + ' &middot; ' + o.items.length + ' item(s)</div></div><span class="status-badge ' + statusClass(o.status) + '">' + esc(o.status) + '</span></div>' +
            '<div class="info-row" style="padding:2px 0;"><span class="k">Total</span><span class="v">' + peso(o.total) + '</span></div>' +
            '</div>';
        }).join('');
      }
      function statusClass(status) {
        return 'st-' + status.toLowerCase().replace(/ /g, '');
      }

      function renderCustomerOrderDetail(user) {
        var o = getOrders().filter(function (x) { return x.id === state.orderDetailId; })[0];
        if (!o || o.customerId !== user.id) {
          return '<div class="empty-state"><h3>Order not found</h3><button class="btn btn-primary" onclick="App.go(\'customer-orders\')">Back to orders</button></div>';
        }
        var canCancel = (o.status === 'Pending' || o.status === 'Confirmed');
        var timeline;
        if (o.status === 'Cancelled') {
          timeline = '<div class="tl-step done current"><div class="tl-dot">' + ICON.close + '</div><div><div class="tl-label">Cancelled</div><div class="tl-time">' + fmtDateTime(lastHistTime(o, 'Cancelled')) + '</div></div></div>';
        } else {
          var idx = STATUS_FLOW.indexOf(o.status);
          timeline = STATUS_FLOW.map(function (s, i) {
            var done = i <= idx;
            var cur = i === idx;
            var t = lastHistTime(o, s);
            return '<div class="tl-step' + (done ? ' done' : '') + (cur ? ' current' : '') + '"><div class="line"></div><div class="tl-dot">' + (done ? ICON.check : (i + 1)) + '</div><div><div class="tl-label">' + s + '</div><div class="tl-time">' + (t ? fmtDateTime(t) : 'Waiting') + '</div></div></div>';
          }).join('');
        }
        var itemsHtml = o.items.map(function (it) {
          return '<div class="info-row"><span class="k">' + esc(it.name) + ' &times; ' + it.qty + '</span><span class="v">' + peso(it.price * it.qty) + '</span></div>';
        }).join('');
        var trackingHtml = '';
        if (o.status !== 'Cancelled') {
          trackingHtml = '' +
            '<div class="section-title">🛵 Live Delivery Tracking &amp; Navigation</div>' +
            '<div id="customer-tracking-react-root"></div>';
        }

        return '' +
          '<button class="btn btn-ghost btn-sm" style="padding-left:0;margin-bottom:10px;" onclick="App.go(\'customer-orders\')">&larr; Back to orders</button>' +
          '<div class="card"><div class="top" style="display:flex;justify-content:space-between;align-items:center;"><div><div class="ordno" style="font-size:17px;">' + esc(o.orderNumber) + '</div><div class="meta">Placed ' + fmtDateTime(o.createdAt) + '</div></div><span class="status-badge ' + statusClass(o.status) + '">' + esc(o.status) + '</span></div></div>' +
          '<div class="section-title">Order status</div>' +
          '<div class="card"><div class="timeline">' + timeline + '</div></div>' +
          trackingHtml +
          '<div class="section-title">Items</div>' +
          '<div class="card">' + itemsHtml + '<div class="divider"></div><div class="summary-row total"><span>Total</span><span>' + peso(o.total) + '</span></div></div>' +
          '<div class="section-title">Delivery details</div>' +
          '<div class="card">' +
          '<div class="info-row"><span class="k">Name</span><span class="v">' + esc(o.delivery.fullName) + '</span></div>' +
          '<div class="info-row"><span class="k">Phone</span><span class="v">' + esc(o.delivery.phone) + '</span></div>' +
          '<div class="info-row"><span class="k">Address</span><span class="v">' + esc(o.delivery.houseStreet + ', ' + o.delivery.barangay) + '</span></div>' +
          '<div class="info-row"><span class="k">GPS Location</span><span class="v" style="font-family:monospace;font-size:11.5px;">' + (getOrderCoords(o) ? getOrderCoords(o).lat.toFixed(5) + ', ' + getOrderCoords(o).lng.toFixed(5) : 'No location saved') + '</span></div>' +
          '<div class="info-row"><span class="k">Landmark</span><span class="v">' + esc(o.delivery.landmark || '\u2014') + '</span></div>' +
          '<div class="info-row"><span class="k">Instructions</span><span class="v">' + esc(o.instructions || '\u2014') + '</span></div>' +
          '<div class="info-row"><span class="k">Payment</span><span class="v">Cash on Delivery</span></div>' +
          '</div>' +
          (canCancel ? '<button class="btn btn-danger btn-block" onclick="App.cancelOrder(\'' + o.id + '\')">Cancel order</button>' : '');
      }
      function lastHistTime(order, status) {
        var h = (order.statusHistory || []).filter(function (x) { return x.status === status; });
        return h.length ? h[h.length - 1].timestamp : null;
      }

      /* ---------- Profile ---------- */
      function renderCustomerProfile(user) {
        return '' +
          '<div class="section-title" style="margin-top:6px;">' + ICON.profile + ' My profile</div>' +
          '<div class="card">' +
          '<form onsubmit="return App.saveProfile(event)">' +
          '<div class="field"><label>Full name</label><input id="pf-fullname" type="text" value="' + esc(user.fullName) + '" required></div>' +
          '<div class="field"><label>Phone number</label><input id="pf-phone" type="tel" value="' + esc(user.phone) + '" required></div>' +
          '<div class="field"><label>Barangay</label><input id="pf-barangay" type="text" value="' + esc(user.barangay) + '" required></div>' +
          '<div class="field"><label>House number / street</label><input id="pf-housestreet" type="text" value="' + esc(user.houseStreet) + '" required></div>' +
          '<div class="field"><label>Nearby landmark</label><input id="pf-landmark" type="text" value="' + esc(user.landmark) + '"></div>' +
          '<div class="field"><label>New password (leave blank to keep current)</label><input id="pf-password" type="password" placeholder="********"></div>' +
          '<button type="submit" class="btn btn-primary btn-block">Save changes</button>' +
          '</form>' +
          '</div>' +
          '<button class="btn btn-outline btn-block" style="margin-top:4px;" onclick="App.logout()">' + ICON.logout + ' Log out</button>';
      }

      /* ================= ADMIN SHELL ================= */
      function renderAdminShell(user) {
        var section = state.adminSection;
        var content;
        if (section === 'orders') content = renderAdminOrders();
        else if (section === 'deliveries') content = renderAdminDeliveries();
        else if (section === 'products') content = renderAdminProducts();
        else if (section === 'inventory') content = renderAdminInventory();
        else if (section === 'customers') content = renderAdminCustomers();
        else if (section === 'notifications') content = renderAdminNotifications(user);
        else content = renderAdminDashboard();

        var titleMap = { dashboard: 'Dashboard', orders: 'Orders', deliveries: 'Deliveries', products: 'Products', inventory: 'Inventory', customers: 'Customers', notifications: 'Notifications' };
        var uc = unreadCount(user.id);

        var html = '<div class="admin-shell">';
        if (state.sidebarOpen) html += '<div class="sidebar-backdrop" onclick="App.toggleSidebar(false)"></div>';
        html += renderAdminSidebar(section);
        html += '<div class="admin-main">';
        html += '<div class="admin-topbar"><div style="display:flex;align-items:center;gap:12px;"><button class="hamburger" onclick="App.toggleSidebar(true)">' + ICON.menu + '</button><h2 style="font-size:18px;font-weight:800;">' + titleMap[section] + '</h2><span class="cloud-badge"><span class="cloud-dot"></span> Firebase Live</span></div><button class="icon-btn" style="background:var(--surface-2);color:var(--ink-700);border:1px solid var(--border);" onclick="App.go(\'admin-notif-drawer\')">' + ICON.bell + (uc > 0 ? '<span class="dot" style="background:var(--red-500);color:#fff;">' + uc + '</span>' : '') + '</button></div>';
        html += '<div class="admin-content">' + content + '</div>';
        html += '</div></div>';
        if (state.notifOpen) html += renderNotifDrawer(user);
        if (state.view === 'admin-product-modal') html += renderProductModal();
        if (state.view === 'admin-order-modal') html += renderAdminOrderModal();
        return html;
      }

      function renderAdminSidebar(section) {
        function item(key, icon, label) {
          return '<button class="' + (section === key ? 'active' : '') + '" onclick="App.setAdminSection(\'' + key + '\')"><span class="ic">' + icon + '</span>' + label + '</button>';
        }
        return '' +
          '<div class="admin-sidebar' + (state.sidebarOpen ? ' open' : '') + '">' +
          '<div class="admin-brand"><div class="mark">' + ICON.store + '</div><span>Aling Nena\'s Admin</span></div>' +
          '<div class="admin-nav">' +
          item('dashboard', ICON.dash, 'Dashboard') +
          item('orders', ICON.orders, 'Orders') +
          item('deliveries', ICON.delivery, 'Deliveries') +
          item('products', ICON.products, 'Products') +
          item('inventory', ICON.inventory, 'Inventory') +
          item('customers', ICON.customers, 'Customers') +
          item('notifications', ICON.bell, 'Notifications') +
          '<div class="grp-label">Account</div>' +
          '<button onclick="App.logout()"><span class="ic">' + ICON.logout + '</span>Log out</button>' +
          '</div>' +
          '</div>';
      }

      function renderAdminDashboard() {
        var orders = getOrders();
        var products = getProducts();
        var today = new Date();
        var todays = orders.filter(function (o) { return isSameDay(o.createdAt, today); });
        var pending = orders.filter(function (o) { return o.status === 'Pending'; });
        var preparing = orders.filter(function (o) { return o.status === 'Preparing'; });
        var outfd = orders.filter(function (o) { return o.status === 'Out for Delivery'; });
        var completed = orders.filter(function (o) { return o.status === 'Delivered'; });
        var totalSales = completed.reduce(function (s, o) { return s + o.total; }, 0);
        var lowStock = products.filter(function (p) { return p.stock > 0 && p.stock <= LOW_STOCK_THRESHOLD; });
        var outStock = products.filter(function (p) { return p.stock <= 0; });

        var stats = [
          [ICON.orders, "Today's Orders", todays.length, ''],
          [ICON.clock, 'Pending Orders', pending.length, pending.length > 0 ? 'warn' : ''],
          [ICON.fire, 'Being Prepared', preparing.length, ''],
          [ICON.truck, 'Out for Delivery', outfd.length, ''],
          [ICON.check, 'Completed Orders', completed.length, ''],
          [ICON.money, 'Total Sales', peso(totalSales), ''],
          [ICON.box, 'Total Products', products.length, ''],
          [ICON.warning, 'Low-Stock Products', lowStock.length, lowStock.length > 0 ? 'warn' : ''],
          [ICON.close, 'Out-of-Stock Products', outStock.length, outStock.length > 0 ? 'danger' : '']
        ];
        var statHtml = stats.map(function (s) {
          return '<div class="stat-card ' + s[3] + '"><span class="stat-icon">' + s[0] + '</span><div class="num">' + s[2] + '</div><div class="lbl">' + s[1] + '</div></div>';
        }).join('');

        var recent = orders.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); }).slice(0, 6);
        var recentHtml = recent.length === 0 ? '<div class="empty-state"><div class="ic">' + ICON.orders + '</div><h3>No orders yet</h3><p>Orders will appear here once customers start ordering.</p></div>' : recent.map(function (o) {
          return '<div class="trow" onclick="App.openOrderModal(\'' + o.id + '\')" style="cursor:pointer;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<div><div style="font-weight:700;font-size:14px;">' + esc(o.orderNumber) + '</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">' + esc(o.delivery.fullName) + ' &middot; ' + fmtDateTime(o.createdAt) + '</div></div>' +
            '<span class="status-badge ' + statusClass(o.status) + '">' + esc(o.status) + '</span>' +
            '</div>' +
            '</div>';
        }).join('');

        return '<div class="stat-grid">' + statHtml + '</div>' +
          '<div class="section-title">Recent orders</div>' +
          '<div class="table-list">' + recentHtml + '</div>';
      }

      function renderAdminOrders() {
        var filters = ['All', 'Pending', 'Confirmed', 'Preparing', 'Out for Delivery', 'Delivered', 'Cancelled'];
        var orders = getOrders().slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        if (state.orderFilter !== 'All') orders = orders.filter(function (o) { return o.status === state.orderFilter; });
        var chips = filters.map(function (f) {
          return '<button class="chip' + (state.orderFilter === f ? ' active' : '') + '" onclick="App.setOrderFilter(\'' + f + '\')">' + f + '</button>';
        }).join('');
        var list = orders.length === 0 ? '<div class="empty-state"><h3>No orders in this filter</h3></div>' : orders.map(function (o) {
          return '' +
            '<div class="trow" onclick="App.openOrderModal(\'' + o.id + '\')" style="cursor:pointer;">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
            '<div><div style="font-weight:700;font-size:14.5px;">' + esc(o.orderNumber) + '</div>' +
            '<div style="font-size:12.5px;color:var(--ink-500);margin-top:3px;">' + esc(o.delivery.fullName) + ' &middot; ' + esc(o.delivery.phone) + '</div>' +
            '<div style="font-size:12px;color:var(--ink-500);margin-top:2px;">' + fmtDateTime(o.createdAt) + ' &middot; ' + o.items.length + ' item(s) &middot; ' + peso(o.total) + '</div></div>' +
            '<span class="status-badge ' + statusClass(o.status) + '">' + esc(o.status) + '</span>' +
            '</div>' +
            '</div>';
        }).join('');
        return '<div class="filter-row">' + chips + '</div><div class="table-list">' + list + '</div>';
      }

      function renderAdminDeliveries() {
        var orders = getOrders().filter(function (o) { return o.status === 'Preparing' || o.status === 'Out for Delivery'; });
        orders.sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });

        var mapHeader = '<div id="admin-radar-react-root"></div>';

        if (orders.length === 0) {
          return mapHeader + '<div class="empty-state"><div class="ic">' + ICON.truck + '</div><h3>No active deliveries</h3><p>Orders being prepared or out for delivery appear here.</p></div>';
        }

        var listHtml = orders.map(function (o) {
          var c = getOrderCoords(o);
          var dist = c && hasStoreGps(STORE_LOCATION) ? calcDistanceKm(STORE_LOCATION.lat, STORE_LOCATION.lng, c.lat, c.lng) : null;
          var distStr = dist !== null ? (dist < 1 ? Math.round(dist * 1000) + 'm' : dist.toFixed(2) + ' km') : (c ? 'Store GPS not set' : 'No drop-off pin');
          return '' +
            '<div class="trow">' +

      /* ================= INITIAL LOCATION & REVERSE GEOCODING ENGINE ================= */
      function reverseGeocode(lat, lng, callback) {
        if (typeof fetch === 'undefined') { callback(null); return; }
        try {
          var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1';
          fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data && data.address) {
                var addr = data.address;
                var barangay = addr.suburb || addr.quarter || addr.neighbourhood || addr.village || addr.city_district || '';
                var road = addr.road || addr.street || addr.building || '';
                var city = addr.city || addr.town || addr.municipality || '';
                var parts = [];
                if (road) parts.push(road);
                if (barangay) parts.push(barangay);
                if (city && city !== barangay) parts.push(city);
                var shortPlace = parts.length > 0 ? parts.join(', ') : (data.display_name ? data.display_name.split(',').slice(0, 2).join(',') : 'Nearby Place');
                callback({
                  placeName: shortPlace,
                  barangay: barangay || city || 'Local Area',
                  street: road || '',
                  fullAddress: data.display_name || shortPlace
                });
              } else {
                callback(null);
              }
            })
            .catch(function (err) {
              console.warn("Reverse geocode notice:", err);
              callback(null);
            });
        } catch (e) {
          callback(null);
        }
      }

        var acc = hasCoords && state.userCoords.accuracy ? ' (~' + state.userCoords.accuracy + 'm accuracy)' : '';

          '<div class="loc-modal-card">' +

      App.dismissLocationModal = function () {

      App.requestLocation = function (showToast) {
        if (typeof navigator === 'undefined' || !navigator.geolocation) {
          if (showToast) toast('Geolocation is not supported by your browser.');
          state.locationStatus = 'unsupported';
          state.locationModalOpen = false;
          render();
          return;
        }

        state.locationStatus = 'requesting';
        if (showToast) toast('📡 Requesting location permission...');
        render();

        navigator.geolocation.getCurrentPosition(function (pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var accuracy = Math.round(pos.coords.accuracy || 15);
          var coords = {
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            manual: false,
            timestamp: new Date().toISOString()
          };
          state.userCoords = coords;
          state.checkoutCoords = coords;
          state.checkoutGpsStatus = 'locked';
          state.locationStatus = 'locked';
          dbSet('sst_user_coords', coords);

          var user = currentUser();
          if (user && user.role === 'admin' && !STORE_LOCATION.isActualGps) {
            setStoreLocation(coords, "Aling Nena's Store", "Actual Store Location (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")");
          }

          reverseGeocode(lat, lng, function (res) {
            if (res) {
              state.userPlaceName = res.placeName;
              state.detectedBarangay = res.barangay;
              state.detectedStreet = res.street;
              dbSet('sst_user_place', res.placeName);
              if (res.barangay) dbSet('sst_user_brgy', res.barangay);
              if (res.street) dbSet('sst_user_street', res.street);
            } else {
              var fallbackPlace = 'GPS: ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
              state.userPlaceName = fallbackPlace;
              dbSet('sst_user_place', fallbackPlace);
            }
            state.locationModalOpen = false;
            render();
            toast('📍 Location locked: ' + (state.userPlaceName || 'Live GPS') + ' (~' + accuracy + 'm accuracy)');
          });

          if (activeMaps.checkout) {
            activeMaps.checkout.flyTo([lat, lng], 17, { duration: 1.2 });
            if (activeMaps.checkoutMarker) {
              activeMaps.checkoutMarker.setLatLng([lat, lng]);
              if (!activeMaps.checkout.hasLayer(activeMaps.checkoutMarker)) activeMaps.checkoutMarker.addTo(activeMaps.checkout);
              activeMaps.checkoutMarker.bindPopup('🟢 <b>Your Live GPS Locked</b><br>' + esc(state.userPlaceName || 'Actual Location')).openPopup();
            }
            if (activeMaps.checkoutAccuracy) activeMaps.checkout.removeLayer(activeMaps.checkoutAccuracy);
            activeMaps.checkoutAccuracy = L.circle([lat, lng], {
              radius: Math.min(120, accuracy),
              color: '#2DA56E',
              fillColor: '#2DA56E',
              fillOpacity: 0.18,
              weight: 1.5
            }).addTo(activeMaps.checkout);
            if (activeMaps.checkoutUpdateRoute) activeMaps.checkoutUpdateRoute(lat, lng);
          }

          setTimeout(function () {
            state.locationModalOpen = false;
            render();
          }, 400);

        }, function (err) {
          console.warn("Location permission notice:", err);
          state.locationStatus = 'denied';
          state.locationModalOpen = false;
          render();
          if (showToast) {
            toast('Location permission denied or unavailable. Tap map on checkout to set pin!');
          }
        }, {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0
        });
      };

      function initLocationOnStartup() {
        if (typeof navigator === 'undefined' || !navigator.geolocation) return;
        var savedCoords = dbGet('sst_user_coords', null);
        var savedPlace = dbGet('sst_user_place', '');
        var savedBrgy = dbGet('sst_user_brgy', '');
        var savedStreet = dbGet('sst_user_street', '');
        if (savedCoords && Number.isFinite(savedCoords.lat)) {
          state.userCoords = savedCoords;
          state.checkoutCoords = savedCoords;
          state.userPlaceName = savedPlace;
          state.detectedBarangay = savedBrgy;
          state.detectedStreet = savedStreet;
          state.checkoutGpsStatus = 'locked';
        }

        // On first visit without saved coordinates, prompt the modal on web and mobile
        if (!savedCoords) {
          state.locationModalOpen = true;
        }

        // Automatically trigger native browser prompt on launch
        try {
          App.requestLocation(false);
        } catch (e) {
          console.warn("Location auto-request notice:", e);
        }
      }

      /* ---- Real-Time Customer GPS Actions ---- */
      App.detectCustomerGps = function (showToast) {
        if (showToast === undefined) showToast = true;
        var btnText = document.getElementById('gps-btn-text');
        if (btnText) btnText.textContent = 'Locating...';
        state.checkoutGpsStatus = 'locating';
        updateCheckoutGpsUi();

        if (!navigator.geolocation) {
          if (showToast) toast('Geolocation not supported by this browser. You can tap or drag the pin on the map!');
          state.checkoutGpsStatus = state.checkoutCoords ? 'manual' : 'idle';
          if (btnText) btnText.textContent = 'Detect My GPS';
          updateCheckoutGpsUi();
          return;
        }

        navigator.geolocation.getCurrentPosition(function (pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var accuracy = Math.round(pos.coords.accuracy || 15);
          state.checkoutCoords = {
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            manual: false,
            timestamp: new Date().toISOString()
          };
          state.checkoutGpsStatus = 'locked';
          if (btnText) btnText.textContent = 'GPS Locked ✓';

          if (activeMaps.checkout) {
            activeMaps.checkout.flyTo([lat, lng], 17, { duration: 1.2 });
            if (activeMaps.checkoutMarker) {
              activeMaps.checkoutMarker.setLatLng([lat, lng]);
              if (!activeMaps.checkout.hasLayer(activeMaps.checkoutMarker)) activeMaps.checkoutMarker.addTo(activeMaps.checkout);
              activeMaps.checkoutMarker.bindPopup('🟢 <b>Your Live GPS Locked</b><br>Accurate to ~' + accuracy + 'm').openPopup();
            }
            if (activeMaps.checkoutAccuracy) {
              activeMaps.checkout.removeLayer(activeMaps.checkoutAccuracy);
            }
            activeMaps.checkoutAccuracy = L.circle([lat, lng], {
              radius: Math.min(120, accuracy),
              color: '#2DA56E',
              fillColor: '#2DA56E',
              fillOpacity: 0.18,
              weight: 1.5
            }).addTo(activeMaps.checkout);

            if (activeMaps.checkoutUpdateRoute) activeMaps.checkoutUpdateRoute(lat, lng);
          }
          updateCheckoutGpsUi();
          if (showToast) toast('📍 Live GPS location locked (~' + accuracy + 'm accuracy)');
        }, function (err) {
          console.warn("GPS detection failed/denied:", err);
          state.checkoutGpsStatus = state.checkoutCoords ? 'manual' : 'idle';
          if (btnText) btnText.textContent = 'Detect My GPS';
          updateCheckoutGpsUi();
          if (showToast) toast('Location permission denied or unavailable. Tap or drag the pin on the map!');
        }, {
          enableHighAccuracy: true,
          timeout: 8000,
          maximumAge: 5000
        });
      };

      /* ---- Real-Time Admin Store GPS Update ---- */
      App.updateStoreToActualGps = function (silent) {
        if (!navigator.geolocation) {
          toast('Geolocation is not supported by your browser.');
          return;
        }
        if (!silent) toast('📡 Detecting admin device GPS location...');
        navigator.geolocation.getCurrentPosition(function (pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var accuracy = Math.round(pos.coords.accuracy || 10);
          setStoreLocation({
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            address: "Admin Store Live GPS (" + lat.toFixed(5) + ", " + lng.toFixed(5) + ")"
          });
          toast('✅ Admin map updated to this device GPS (~' + accuracy + 'm accuracy)');
          render();
        }, function (err) {
          console.warn("Admin GPS error:", err);
          if (!silent) toast('Could not detect GPS: ' + (err.message || 'Permission denied'));
        }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      };

      App.recenterTrackingMap = function () {
        if (activeMaps.customerTracking) {
          var o = getOrders().filter(function (x) { return x.id === state.orderDetailId; })[0];
          if (o && getOrderCoords(o)) {
            var c = getOrderCoords(o);
            var store = getStoreLocation();
            if (hasStoreGps(store)) activeMaps.customerTracking.fitBounds([
              [store.lat, store.lng],
              [c.lat, c.lng]
            ], { padding: [40, 40] });
            else activeMaps.customerTracking.setView([c.lat, c.lng], 15);
          }
        }
      };

      function renderInPlace() { render(); }

      /* ---- Auth ---- */
      App.handleLogin = function (e) {
        e.preventDefault();
        var phone = document.getElementById('login-phone').value.trim();
        var password = document.getElementById('login-password').value;
        var user = getUsers().filter(function (u) { return u.phone === phone; })[0];
        if (!user || user.password !== password) {
          state.loginError = 'Incorrect phone number or password.';
          render();
          return false;
        }
        state.loginError = '';
        setSession(user.id);
        state.view = user.role === 'admin' ? 'admin-dashboard' : 'customer-home';
        state.adminSection = 'dashboard';
        render();
        toast('Welcome back, ' + user.fullName.split(' ')[0] + '!');
        return false;
      };
      App.handleRegister = function (e) {
        e.preventDefault();
        var vals = {
          fullName: document.getElementById('reg-fullname').value.trim(),
          phone: document.getElementById('reg-phone').value.trim(),
          barangay: document.getElementById('reg-barangay').value.trim(),
          houseStreet: document.getElementById('reg-housestreet').value.trim(),
          landmark: document.getElementById('reg-landmark').value.trim(),
          password: document.getElementById('reg-password').value,
          confirm: document.getElementById('reg-confirm').value
        };
        var err = {};
        if (!vals.fullName) err.fullName = 'Full name is required.';
        if (!vals.phone || !/^[0-9+ ]{7,15}$/.test(vals.phone)) err.phone = 'Enter a valid phone number.';
        else if (getUsers().some(function (u) { return u.phone === vals.phone; })) err.phone = 'This phone number is already registered.';
        if (!vals.barangay) err.barangay = 'Barangay is required.';
        if (!vals.houseStreet) err.houseStreet = 'House number / street is required.';
        if (!vals.password || vals.password.length < 6) err.password = 'Password must be at least 6 characters.';
        if (vals.confirm !== vals.password) err.confirm = 'Passwords do not match.';
        if (Object.keys(err).length) {
          state.registerError = err;
          render();
          return false;
        }
        var users = getUsers();
        var newUser = {
          id: uid('user'), role: 'customer', fullName: vals.fullName, phone: vals.phone,
          password: vals.password, barangay: vals.barangay, houseStreet: vals.houseStreet,
          landmark: vals.landmark, createdAt: new Date().toISOString()
        };
        users.push(newUser);
        saveUsers(users);
        state.registerError = {};
        setSession(newUser.id);
        state.view = 'customer-home';
        render();
        toast('Account created. Welcome, ' + newUser.fullName.split(' ')[0] + '!');
        return false;
      };
      App.logout = function () {
        stopRiderDeviceGps();
        destroyMap('checkout');
        destroyMap('customerTracking');
        destroyMap('adminDeliveries');
        clearSession();
        state.view = 'auth-login';
        state.adminSection = 'dashboard';
        render();
      };

      /* ---- Profile ---- */
      App.saveProfile = function (e) {
        e.preventDefault();
        var user = currentUser();
        var users = getUsers();
        var u = users.filter(function (x) { return x.id === user.id; })[0];
        u.fullName = document.getElementById('pf-fullname').value.trim();
        u.phone = document.getElementById('pf-phone').value.trim();
        u.barangay = document.getElementById('pf-barangay').value.trim();
        u.houseStreet = document.getElementById('pf-housestreet').value.trim();
        u.landmark = document.getElementById('pf-landmark').value.trim();
        var newPw = document.getElementById('pf-password').value;
        if (newPw) u.password = newPw;
        saveUsers(users);
        toast('Profile updated.');
        render();
        return false;
      };

      /* ---- Cart ---- */
      App.addToCart = function (productId) {
        var p = productById(productId);
        if (!p || p.stock <= 0 || p.status === 'unavailable') { toast('This product is not available.'); return; }
        var cart = getCart();
        var existing = cart.filter(function (c) { return c.productId === productId; })[0];
        if (existing) {
          if (existing.qty < p.stock) existing.qty++;
        } else {
          cart.push({ productId: productId, qty: 1 });
        }
        saveCart(cart);
        toast(p.name + ' added to cart.');
        render();
      };
      App.cartInc = function (productId) {
        var p = productById(productId);
        var cart = getCart();
        var item = cart.filter(function (c) { return c.productId === productId; })[0];
        if (!item) { cart.push({ productId: productId, qty: 1 }); }
        else if (item.qty < p.stock) { item.qty++; }
        else { toast('Only ' + p.stock + ' pcs available.'); }
        saveCart(cart);
        render();
      };
      App.cartDec = function (productId) {
        var cart = getCart();
        var item = cart.filter(function (c) { return c.productId === productId; })[0];
        if (!item) return;
        item.qty--;
        if (item.qty <= 0) cart = cart.filter(function (c) { return c.productId !== productId; });
        saveCart(cart);
        render();
      };
      App.cartRemove = function (productId) {
        var cart = getCart().filter(function (c) { return c.productId !== productId; });
        saveCart(cart);
        render();
      };
      App.goCheckout = function () {
        var cart = getCart();
        if (cart.length === 0) { toast('Your cart is empty.'); return; }
        for (var i = 0; i < cart.length; i++) {
          var p = productById(cart[i].productId);
          if (!p || p.stock <= 0 || p.status === 'unavailable' || cart[i].qty > p.stock) {
            toast('Some items in your cart are no longer available in that quantity.');
            var fixed = cart.filter(function (c) {
              var pr = productById(c.productId);
              return pr && pr.status !== 'unavailable' && pr.stock > 0;
            }).map(function (c) {
              var pr = productById(c.productId);
              return { productId: c.productId, qty: Math.min(c.qty, pr.stock) };
            });
            saveCart(fixed);
            render();
            return;
          }
        }
        state.cartOpen = false;
        state.addressEditing = false;
        state.checkoutInstructions = '';
        App.go('customer-checkout');
      };
      App.editCheckoutAddress = function () { state.addressEditing = true; render(); };
      App.saveCheckoutAddress = function () {
        var user = currentUser();
        var users = getUsers();
        var u = users.filter(function (x) { return x.id === user.id; })[0];
        u.barangay = document.getElementById('chk-barangay').value.trim();
        u.houseStreet = document.getElementById('chk-housestreet').value.trim();
        u.landmark = document.getElementById('chk-landmark').value.trim();
        u.phone = document.getElementById('chk-phone').value.trim();
        saveUsers(users);
        state.addressEditing = false;
        toast('Address updated.');
        render();
      };

      /* ---- Place order ---- */
      App.placeOrder = function () {
        var user = currentUser();
        var cart = getCart();
        if (cart.length === 0) { toast('Your cart is empty.'); return; }
        if (!user.barangay || !user.houseStreet || !user.phone) {
          toast('Please complete your delivery address before checking out.');
          state.addressEditing = true; render(); return;
        }
        if (!state.checkoutCoords || !Number.isFinite(state.checkoutCoords.lat) || !Number.isFinite(state.checkoutCoords.lng)) {
          toast('Set your real drop-off location using GPS or by tapping the map before placing the order.');
          return;
        }
        var instructionsEl = document.getElementById('chk-instructions');
        var instructions = instructionsEl ? instructionsEl.value.trim() : '';

        var products = getProducts();
        var items = [];
        var total = 0;
        for (var i = 0; i < cart.length; i++) {
          var p = products.filter(function (x) { return x.id === cart[i].productId; })[0];
          if (!p || p.status === 'unavailable' || p.stock <= 0 || cart[i].qty > p.stock) {
            toast('One or more items are no longer available in the requested quantity. Please review your cart.');
            render();
            return;
          }
          items.push({ productId: p.id, name: p.name, price: p.price, qty: cart[i].qty });
          total += p.price * cart[i].qty;
        }
        var now = new Date().toISOString();
        var coords = state.checkoutCoords;
        var order = {
          id: uid('order'),
          orderNumber: nextOrderNumber(),
          customerId: user.id,
          items: items,
          total: total,
          delivery: {
            fullName: user.fullName,
            phone: user.phone,
            barangay: user.barangay,
            houseStreet: user.houseStreet,
            landmark: user.landmark,
            lat: coords.lat,
            lng: coords.lng,
            gpsAccuracy: coords.accuracy || null,
            gpsTime: coords.timestamp || now
          },
          instructions: instructions,
          paymentMethod: 'COD',
          status: 'Pending',
          stockDeducted: false,
          statusHistory: [{ status: 'Pending', timestamp: now }],
          createdAt: now
        };
        var orders = getOrders();
        orders.push(order);
        saveOrders(orders);
        saveCart([]);
        state.checkoutCoords = null;
        state.checkoutGpsStatus = 'idle';
        var admin = getUsers().filter(function (u) { return u.role === 'admin'; })[0];
        if (admin) addNotif(admin.id, 'New order ' + order.orderNumber + ' from ' + user.fullName + ' \u2014 ' + peso(total) + '.', 'newOrder', order.id);
        state.checkoutInstructions = '';
        state.orderDetailId = order.id;
        App.go('customer-order-detail');
        toast('Order placed! We will confirm it shortly.');
      };

      /* ---- Cancel (customer) ---- */
      App.cancelOrder = function (orderId) {
        if (!confirm('Cancel this order? This cannot be undone.')) return;
        var orders = getOrders();
        var o = orders.filter(function (x) { return x.id === orderId; })[0];
        if (!o) return;
        if (o.status !== 'Pending' && o.status !== 'Confirmed') {
          toast('This order can no longer be cancelled.');
          return;
        }
        if (o.stockDeducted) {
          restockOrder(o);
        }
        o.status = 'Cancelled';
        o.statusHistory.push({ status: 'Cancelled', timestamp: new Date().toISOString() });
        saveOrders(orders);
        addNotif(o.customerId, 'Your order ' + o.orderNumber + ' was cancelled.', 'cancel', o.id);
        toast('Order cancelled.');
        render();
      };

      function restockOrder(order) {
        var products = getProducts();
        order.items.forEach(function (it) {
          var p = products.filter(function (x) { return x.id === it.productId; })[0];
          if (p) p.stock += it.qty;
        });
        saveProducts(products);
      }

      /* ---- Admin order actions ---- */
      App.openOrderModal = function (orderId) {
        state.orderDetailId = orderId;
        state.view = 'admin-order-modal';
        render();
      };
      App.confirmOrder = function (orderId) {
        var orders = getOrders();
        var o = orders.filter(function (x) { return x.id === orderId; })[0];
        if (!o || o.status !== 'Pending') return;
        var products = getProducts();
        for (var i = 0; i < o.items.length; i++) {
          var p = products.filter(function (x) { return x.id === o.items[i].productId; })[0];
          if (!p || p.stock < o.items[i].qty) {
            toast('Cannot confirm: insufficient stock for ' + (p ? p.name : 'a product') + '. Please adjust inventory first.');
            return;
          }
        }
        o.items.forEach(function (it) {
          var p = products.filter(function (x) { return x.id === it.productId; })[0];
          p.stock -= it.qty;
        });
        saveProducts(products);
        o.status = 'Confirmed';
        o.stockDeducted = true;
        o.statusHistory.push({ status: 'Confirmed', timestamp: new Date().toISOString() });
        saveOrders(orders);
        addNotif(o.customerId, 'Good news! Your order ' + o.orderNumber + ' has been confirmed.', 'status', o.id);
        toast('Order confirmed.');
        App.closeModal();
      };
      App.rejectOrder = function (orderId) {
        if (!confirm('Reject/cancel this order?')) return;
        var orders = getOrders();
        var o = orders.filter(function (x) { return x.id === orderId; })[0];
        if (!o) return;
        if (o.stockDeducted) restockOrder(o);
        o.status = 'Cancelled';
        o.statusHistory.push({ status: 'Cancelled', timestamp: new Date().toISOString() });
        saveOrders(orders);
        addNotif(o.customerId, 'Sorry, your order ' + o.orderNumber + ' was rejected/cancelled by the store.', 'cancel', o.id);
        toast('Order rejected.');
        App.closeModal();
      };
      App.advanceStatus = function (orderId, newStatus) {
        var orders = getOrders();
        var o = orders.filter(function (x) { return x.id === orderId; })[0];
        if (!o) return;
        o.status = newStatus;
        if (newStatus === 'Delivered' && activeRiderWatchingOrderId === orderId) stopRiderDeviceGps();
        o.statusHistory.push({ status: newStatus, timestamp: new Date().toISOString() });
        saveOrders(orders);
        var msgs = {
          'Preparing': 'Your order ' + o.orderNumber + ' is now being prepared.',
          'Out for Delivery': 'Your order ' + o.orderNumber + ' is out for delivery!',
          'Delivered': 'Your order ' + o.orderNumber + ' has been delivered. Enjoy!'
        };
        if (msgs[newStatus]) addNotif(o.customerId, msgs[newStatus], 'status', o.id);
        toast('Order marked as ' + newStatus + '.');
        if (state.view === 'admin-order-modal') App.closeModal(); else render();
      };

      /* ---- Admin: products ---- */
      App.openProductModal = function (productId) {
        state.editingProductId = productId;
        state.productFormCategory = null;
        state.productFormImage = undefined;
        state.view = 'admin-product-modal';
        render();
      };
      App.handleProductImage = function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var maxW = 300;
            var scale = Math.min(1, maxW / img.width);
            var canvas = document.createElement('canvas');
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            var dataUrl;
            try { dataUrl = canvas.toDataURL('image/jpeg', 0.8); }
            catch (err) { dataUrl = ev.target.result; }
            state.productFormImage = dataUrl;
            var prev = document.getElementById('prod-img-prev');
            if (prev) prev.innerHTML = '<img src="' + dataUrl + '">';
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
      App.saveProduct = function (e) {
        e.preventDefault();
        var name = document.getElementById('pd-name').value.trim();
        var categoryId = document.getElementById('pd-category').value;
        var description = document.getElementById('pd-desc').value.trim();
        var price = parseFloat(document.getElementById('pd-price').value);
        var stock = parseInt(document.getElementById('pd-stock').value, 10);
        var status = document.getElementById('pd-status').value;
        if (!name || isNaN(price) || price < 0 || isNaN(stock) || stock < 0) {
          toast('Please fill in valid product details.');
          return false;
        }
        var products = getProducts();
        var cat = categoryById(categoryId);
        if (state.editingProductId) {
          var p = products.filter(function (x) { return x.id === state.editingProductId; })[0];
          p.name = name; p.categoryId = categoryId; p.description = description; p.price = price; p.stock = stock; p.status = status;
          if (state.productFormImage !== undefined) p.image = state.productFormImage;
          if (!p.emoji && cat) p.emoji = cat.emoji;
          toast('Product updated.');
        } else {
          products.push({
            id: uid('prod'), name: name, categoryId: categoryId, description: description,
            price: price, stock: stock, status: status, image: state.productFormImage || null,
            emoji: cat ? cat.emoji : ICON.box, createdAt: new Date().toISOString()
          });
          toast('Product added.');
        }
        saveProducts(products);
        App.closeModal();
        return false;
      };
      App.deleteProduct = function (productId) {
        if (!confirm('Remove this product from the store? Customers will no longer see it.')) return;
        var products = getProducts().filter(function (p) { return p.id !== productId; });
        saveProducts(products);
        toast('Product removed.');
        render();
      };
      App.adjustStock = function (productId, delta) {
        var products = getProducts();
        var p = products.filter(function (x) { return x.id === productId; })[0];
        if (!p) return;
        p.stock = Math.max(0, p.stock + delta);
        saveProducts(products);
        render();
      };

      /* ---- Theme toggle (kept simple; respects system by default) ---- */
      window.App = App;
      window.state = state;

      /* ================= INIT ================= */
      seedIfNeeded();
      ensureDemoCustomersExist();
      updateProductImagesIfNeeded();
      if (getSession() && !currentUser()) clearSession();
      render();
      initCloudRealtimeListeners();

    })();
  </script>
</body>

</html>
