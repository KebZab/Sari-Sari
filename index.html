<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NelGlenn's Sari-Sari Store</title>
  <meta name="description"
    content="Order groceries and essentials from NelGlenn's Sari-Sari Store. Fast delivery to your doorstep.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Leaflet CSS for Real-time GPS & Dispatch Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Modular Stylesheet Bundle -->
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <div id="app"></div>
  <div id="toast-wrap"></div>

  <!-- Firebase App, Cloud Firestore, Realtime Database & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

  <!-- React 18 & ReactDOM for Realtime Maps & Dispatch Components -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Leaflet JS for Real-time GPS & Dispatch Maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Modular Application Architecture -->
  <script src="js/config.js"></script>
  <script src="js/store-db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/geolocation.js"></script>
  <script src="js/map-engine.js"></script>
  <script src="js/views/auth.views.js"></script>
  <script src="js/views/customer.views.js"></script>
  <script src="js/views/admin.views.js"></script>
  <script src="js/views/location.modal.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
