<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aling Nena's Sari-Sari Store</title>
  <meta name="description"
    content="Order groceries and essentials from Aling Nena's Sari-Sari Store. Fast delivery to your doorstep.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Leaflet CSS for Real-time GPS & Dispatch Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --green-900: #0B2E1F;
      --green-800: #134D34;
      --green-700: #1A6B49;
      --green-600: #22875B;
      --green-500: #2DA56E;
      --green-400: #4EBD8A;
      --green-300: #7ED4A9;
      --green-200: #B0E6CA;
      --green-100: #DFF5EA;
      --green-50: #F0FAF4;
      --gold-600: #B8771A;
      --gold-500: #E49B2C;
      --gold-400: #F0B95E;
      --gold-100: #FDF1D8;
      --red-600: #B23A3A;
      --red-500: #D64545;
      --red-100: #FBE4E4;
      --ink-900: #111D16;
      --ink-800: #1E3027;
      --ink-700: #36504A;
      --ink-600: #4A6A5E;
      --ink-500: #6A8A7E;
      --ink-400: #8DA99E;
      --ink-300: #AAC4BA;
      --ink-200: #CDE0D6;
      --ink-100: #E8F0EC;
      --bg: #F4F9F6;
      --surface: #FFFFFF;
      --surface-2: #EEF6F1;
      --surface-3: #E3EFE8;
      --border: #D5E5DC;
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow-xs: 0 1px 2px rgba(11, 46, 31, 0.04);
      --shadow-sm: 0 2px 8px rgba(11, 46, 31, 0.06), 0 1px 2px rgba(11, 46, 31, 0.04);
      --shadow-md: 0 8px 24px rgba(11, 46, 31, 0.08), 0 2px 6px rgba(11, 46, 31, 0.04);
      --shadow-lg: 0 16px 48px rgba(11, 46, 31, 0.12), 0 4px 12px rgba(11, 46, 31, 0.06);
      --shadow-glow: 0 0 40px rgba(34, 135, 91, 0.15);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-med: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0C1510;
        --surface: #141F18;
        --surface-2: #1B2A21;
        --surface-3: #233529;
        --border: #2D4037;
        --ink-900: #EAF3EC;
        --ink-800: #D4E2D8;
        --ink-700: #B0C8B8;
        --ink-600: #8CAA98;
        --ink-500: #6B8D7A;
        --ink-400: #527260;
        --ink-300: #3D5A4B;
        --ink-200: #2D4037;
        --ink-100: #1B2A21;
        --green-50: #111E16;
        --green-100: #1A3024;
        --green-200: #234232;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.35);
        --shadow-glow: 0 0 40px rgba(34, 135, 91, 0.2);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0C1510;
      --surface: #141F18;
      --surface-2: #1B2A21;
      --surface-3: #233529;
      --border: #2D4037;
      --ink-900: #EAF3EC;
      --ink-800: #D4E2D8;
      --ink-700: #B0C8B8;
      --ink-600: #8CAA98;
      --ink-500: #6B8D7A;
      --ink-400: #527260;
      --ink-300: #3D5A4B;
      --ink-200: #2D4037;
      --ink-100: #1B2A21;
      --green-50: #111E16;
      --green-100: #1A3024;
      --green-200: #234232;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 0 40px rgba(34, 135, 91, 0.2);
      color-scheme: dark;
    }

    /* ---- Reset & Base ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink-900);
      font-family: var(--font-body);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-display);
      margin: 0;
      color: var(--ink-900);
      line-height: 1.25;
    }

    p {
      margin: 0;
    }

    button {
      font-family: var(--font-body);
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    select,
    textarea {
      font-family: var(--font-body);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--ink-300);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink-400);
    }

    .hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---- Animated Background for Auth ---- */
    .auth-bg {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--green-900) 0%, #0a3324 25%, #0f4433 50%, var(--green-800) 75%, #1a5c40 100%);
    }

    .auth-bg::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 165, 110, 0.25) 0%, transparent 70%);
      top: -150px;
      right: -100px;
      animation: float1 8s ease-in-out infinite;
    }

    .auth-bg::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(228, 155, 44, 0.12) 0%, transparent 70%);
      bottom: -100px;
      left: -80px;
      animation: float2 10s ease-in-out infinite;
    }

    @keyframes float1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-40px, 30px) scale(1.1);
      }
    }

    @keyframes float2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -40px) scale(1.08);
      }
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--radius-lg);
      padding: 13px 24px;
      font-weight: 700;
      font-size: 14px;
      transition: all var(--transition-fast);
      line-height: 1;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .btn:hover::after {
      opacity: 1;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--green-600), var(--green-700));
      color: #fff;
      box-shadow: 0 4px 12px rgba(26, 107, 73, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(26, 107, 73, 0.4);
      transform: translateY(-1px);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
      color: #3A2405;
    }

    .btn-outline {
      background: transparent;
      color: var(--green-700);
      border: 2px solid var(--green-400);
      border-radius: var(--radius-lg);
    }

    .btn-outline:hover {
      background: var(--green-50);
      border-color: var(--green-600);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-600);
    }

    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--ink-900);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--red-500), var(--red-600));
      color: #fff;
      box-shadow: 0 4px 12px rgba(178, 58, 58, 0.3);
    }

    .btn-sm {
      padding: 9px 16px;
      font-size: 13px;
      border-radius: var(--radius-md);
    }

    .btn-block {
      width: 100%;
    }

    .btn:disabled {
      opacity: .4;
      pointer-events: none;
      box-shadow: none;
    }

    /* ---- Form Fields ---- */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-600);
      margin-bottom: 7px;
      letter-spacing: 0.02em;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--ink-900);
      font-size: 15px;
      outline: none;
      transition: all var(--transition-fast);
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--green-500);
      box-shadow: 0 0 0 4px rgba(34, 135, 91, 0.1);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--ink-400);
    }

    .field textarea {
      resize: vertical;
      min-height: 80px;
    }

    .field-error {
      color: var(--red-600);
      font-size: 12.5px;
      margin-top: 6px;
      display: none;
      font-weight: 500;
    }

    .field.has-error input,
    .field.has-error select,
    .field.has-error textarea {
      border-color: var(--red-500);
    }

    .field.has-error .field-error {
      display: block;
    }

    .field-hint {
      font-size: 12px;
      color: var(--ink-500);
      margin-top: 5px;
    }

    /* ---- Layout ---- */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Customer screens: mobile phone frame */
    .mobile-frame {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    .screen {
      width: 100%;
      padding: 16px 16px 100px;
    }

    .screen-wide {
      max-width: 1200px;
    }

    .center-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---- Auth Card ---- */
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.25);
      position: relative;
      z-index: 2;
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    :root[data-theme="dark"] .auth-card {
      background: rgba(20, 31, 24, 0.92);
      border-color: rgba(45, 64, 55, 0.5);
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .auth-card {
        background: rgba(20, 31, 24, 0.92);
        border-color: rgba(45, 64, 55, 0.5);
      }
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .auth-logo .mark {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 12px rgba(26, 107, 73, 0.25);
      flex-shrink: 0;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .auth-sub {
      color: var(--ink-500);
      font-size: 14px;
      margin: 4px 0 24px;
      line-height: 1.5;
    }

    .auth-switch {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--ink-500);
    }

    .auth-switch button {
      background: none;
      border: none;
      color: var(--green-600);
      font-weight: 800;
      font-size: 14px;
      padding: 0;
      transition: color var(--transition-fast);
    }

    .auth-switch button:hover {
      color: var(--green-800);
    }

    .demo-hint {
      background: linear-gradient(135deg, var(--gold-100), #FFF8ED);
      border: 1.5px dashed var(--gold-400);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 12.5px;
      color: #6B4A0D;
      margin-top: 20px;
      line-height: 1.6;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    /* ---- Customer Topbar (mobile app style) ---- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(135deg, var(--green-900), var(--green-800));
      color: #fff;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
      box-shadow: 0 4px 20px rgba(11, 46, 31, 0.2);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand .mark {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-text .name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .brand-text .tag {
      font-size: 11px;
      opacity: .7;
      font-weight: 500;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all var(--transition-fast);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn .dot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--gold-500);
      color: #3A2405;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .search-wrap {
      margin: 12px 0 0;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: var(--radius-lg);
      border: none;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      font-size: 14px;
      color: var(--ink-900);
      outline: none;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: all var(--transition-fast);
    }

    .search-wrap input:focus {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      background: #fff;
    }

    .search-wrap .si {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .45;
      font-size: 14px;
    }

    .cat-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 12px 16px 14px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1.5px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-600);
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .chip:active {
      transform: scale(0.95);
    }

    .chip.active {
      background: linear-gradient(135deg, var(--green-600), var(--green-700));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 3px 10px rgba(26, 107, 73, 0.25);
    }

    /* ---- Active Order Banner ---- */
    .active-order-card {
      margin: 16px 0;
      background: linear-gradient(135deg, var(--green-700), var(--green-500));
      color: #fff;
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-md), var(--shadow-glow);
      position: relative;
      overflow: hidden;
    }

    .active-order-card::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .active-order-card .row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .active-order-card .ord-no {
      font-size: 12px;
      opacity: .8;
      margin-top: 4px;
      font-weight: 500;
    }

    .active-order-card .status-pill {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: var(--radius-lg);
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .progress-track {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
    }

    .progress-track .seg {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease;
    }

    .progress-track .seg.done {
      background: #fff;
    }

    .active-order-card .cta {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      background: none;
      border: none;
      color: #fff;
      padding: 0;
      opacity: 0.9;
    }

    .active-order-card .cta:hover {
      opacity: 1;
    }

    /* ---- Product Grid ---- */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin: 22px 0 12px;
      color: var(--ink-900);
      letter-spacing: -0.01em;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .p-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }

    .p-card:active {
      transform: scale(0.98);
      transition: transform 0.1s ease;
    }

    .p-img {
      aspect-ratio: 1.15/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
    }

    :root[data-theme="dark"] .p-img { background: #1B2A21; }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .p-img {
        background: #1B2A21;
      }
    }

    .p-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      transition: transform var(--transition-med);
    }

    .p-card:active .p-img img {
      transform: scale(0.96);
    }

    .p-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: var(--radius-lg);
      letter-spacing: .3px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .badge-in {
      background: rgba(223, 245, 234, 0.9);
      color: var(--green-800);
    }

    .badge-low {
      background: rgba(253, 241, 216, 0.9);
      color: var(--gold-600);
    }

    .badge-out {
      background: rgba(251, 228, 228, 0.9);
      color: var(--red-600);
    }

    .p-body {
      padding: 10px 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .p-cat {
      font-size: 10px;
      color: var(--ink-500);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .p-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      min-height: 34px;
      color: var(--ink-800);
    }

    .p-price {
      font-size: 16px;
      font-weight: 900;
      color: var(--green-700);
      margin-top: 1px;
      font-family: var(--font-display);
    }

    .p-stockline {
      font-size: 10.5px;
      color: var(--ink-500);
      font-weight: 500;
    }

    .p-foot {
      margin-top: auto;
      padding-top: 8px;
    }

    .add-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--green-600), var(--green-700));
      color: #fff;
      border-radius: var(--radius-md);
      padding: 9px;
      font-weight: 700;
      font-size: 12.5px;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(26, 107, 73, 0.2);
    }

    .add-btn:active {
      opacity: 0.85;
      transform: scale(0.97);
    }

    .add-btn:disabled {
      background: var(--ink-300);
      color: var(--ink-100);
      box-shadow: none;
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--green-100);
      border-radius: var(--radius-md);
      padding: 4px;
      border: 2px solid var(--green-200);
    }

    .qty-stepper button {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--surface);
      color: var(--green-700);
      font-weight: 900;
      font-size: 15px;
      box-shadow: var(--shadow-xs);
      transition: all var(--transition-fast);
    }

    .qty-stepper button:hover {
      background: var(--green-50);
    }

    .qty-stepper span {
      font-weight: 800;
      font-size: 14px;
      color: var(--green-800);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--ink-500);
    }

    .empty-state .ic {
      font-size: 42px;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .empty-state h3 {
      font-size: 16px;
      color: var(--ink-700);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .empty-state p {
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* ---- Bottom Nav (mobile app) ---- */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
    }

    :root[data-theme="dark"] .bottom-nav { background: rgba(20, 31, 24, 0.92); }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .bottom-nav {
        background: rgba(20, 31, 24, 0.92);
      }
    }

    .bottom-nav button {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      color: var(--ink-400);
      font-size: 10px;
      font-weight: 700;
      position: relative;
      transition: all var(--transition-fast);
      border-radius: var(--radius-sm);
    }

    .bottom-nav button .ic {
      font-size: 20px;
      transition: transform var(--transition-fast);
    }

    .bottom-nav button.active {
      color: var(--green-600);
    }

    .bottom-nav button.active .ic {
      transform: scale(1.1);
    }

    .bottom-nav .nav-badge {
      position: absolute;
      top: -1px;
      right: 16%;
      min-width: 16px;
      height: 16px;
      padding: 0 3px;
      border-radius: 8px;
      background: var(--red-500);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(214, 69, 69, 0.3);
    }

    /* ---- Overlay / Drawer / Modal ---- */
    .overlay-bg {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 14, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 40;
      display: flex;
      justify-content: flex-end;
      animation: overlayIn 0.2s ease;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .overlay-bg.center {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Customer drawers: bottom-sheet style */
    .overlay-bg.bottom-sheet {
      justify-content: center;
      align-items: flex-end;
    }

    .drawer-bottom {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      max-height: 88vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      animation: sheetUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .sheet-handle {
      display: flex;
      justify-content: center;
      padding: 10px 0 4px;
    }

    .sheet-handle::after {
      content: '';
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--ink-300);
    }

    /* Admin drawers: side slide (desktop-friendly) */
    .drawer {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      animation: drawerSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.12);
    }

    @keyframes drawerSlide {
      from {
        transform: translateX(100%);
      }

      to {
        transform: translateX(0);
      }
    }

    .drawer-head {
      position: sticky;
      top: 0;
      background: var(--surface);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }

    .drawer-head h3 {
      font-size: 17px;
      font-weight: 800;
    }

    .close-x {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--surface-2);
      font-size: 15px;
      color: var(--ink-600);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-x:active {
      background: var(--surface-3);
      color: var(--ink-900);
    }

    .drawer-body {
      padding: 16px 18px;
      flex: 1;
    }

    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border);
    }

    @keyframes modalPop {
      from {
        transform: scale(0.92) translateY(10px);
        opacity: 0;
      }

      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .modal-head {
      padding: 22px 24px 0;
    }

    .modal-body {
      padding: 16px 24px 24px;
    }

    
    /* ---- Initial Location Permission Modal & Indicator ---- */
    .loc-modal-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      text-align: center;
      padding: 32px 24px 28px;
      animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .loc-icon-bubble {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(45, 165, 110, 0.16), rgba(34, 135, 91, 0.28));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      position: relative;
    }
    .loc-icon-bubble::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid var(--green-400);
      opacity: 0.6;
      animation: radarPulse 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .loc-title {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 800;
      color: var(--ink-900);
      margin-bottom: 8px;
    }
    .loc-subtitle {
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-600);
      margin-bottom: 22px;
    }
    .loc-detected-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-50);
      border: 1px solid var(--green-200);
      color: var(--green-800);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: left;
      max-width: 100%;
    }
    .loc-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .loc-btn-primary {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      color: #FFFFFF;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(34, 135, 91, 0.3);
      transition: all var(--transition-fast);
    }
    .loc-btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(34, 135, 91, 0.2);
    }
    .loc-btn-secondary {
      background: transparent;
      border: none;
      color: var(--ink-500);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
    }
    .loc-btn-secondary:hover {
      color: var(--ink-800);
    }
    .topbar-location-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      margin: 8px 0 2px;
      font-size: 12px;
      color: var(--ink-700);
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all var(--transition-fast);
      user-select: none;
    }
    .topbar-location-bar:hover {
      background: var(--surface-3);
    }
    .topbar-location-bar .loc-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .topbar-location-bar .loc-action {
      color: var(--green-600);
      font-weight: 700;
      font-size: 11px;
    }

    /* ---- Cart ---- */
    .cart-item {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item .thumb {
      width: 58px;
      height: 58px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .cart-item .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 3px;
    }

    .cart-item .info {
      flex: 1;
      min-width: 0;
    }

    .cart-item .nm {
      font-size: 14px;
      font-weight: 700;
    }

    .cart-item .pr {
      font-size: 13px;
      color: var(--ink-500);
      margin-top: 3px;
      font-weight: 500;
    }

    .cart-item .rowend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .link-danger {
      background: none;
      border: none;
      color: var(--red-600);
      font-size: 12px;
      font-weight: 700;
      transition: color var(--transition-fast);
    }

    .link-danger:hover {
      color: var(--red-500);
    }

    .cart-summary {
      position: sticky;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 18px max(16px, env(safe-area-inset-bottom, 16px));
      margin: 0 -18px;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--ink-600);
      margin-bottom: 5px;
    }

    .summary-row.total {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink-900);
      margin: 10px 0 14px;
      font-family: var(--font-display);
    }

    /* ---- Cards / Lists ---- */
    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
      border: 1px solid var(--border);
      transition: all var(--transition-fast);
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      padding: 7px 0;
    }

    .info-row .k {
      color: var(--ink-500);
      font-weight: 500;
    }

    .info-row .v {
      font-weight: 700;
      text-align: right;
      color: var(--ink-800);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 14px 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border-radius: var(--radius-lg);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .st-pending {
      background: var(--gold-100);
      color: var(--gold-600);
    }

    .st-confirmed {
      background: #DDEBFB;
      color: #2A5F94;
    }

    .st-preparing {
      background: #EDE3FB;
      color: #6A3FA0;
    }

    .st-outfordelivery {
      background: #D9F0EA;
      color: #1E7A63;
    }

    .st-delivered {
      background: var(--green-100);
      color: var(--green-800);
    }

    .st-cancelled {
      background: var(--red-100);
      color: var(--red-600);
    }

    .order-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .order-card:active {
      transform: scale(0.98);
    }

    .order-card .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .order-card .ordno {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .order-card .meta {
      font-size: 11.5px;
      color: var(--ink-500);
      margin-top: 3px;
      font-weight: 500;
    }

    .timeline {
      margin: 12px 0;
    }

    .tl-step {
      display: flex;
      gap: 14px;
      padding-bottom: 22px;
      position: relative;
    }

    .tl-step:last-child {
      padding-bottom: 0;
    }

    .tl-step .line {
      position: absolute;
      left: 13px;
      top: 28px;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .tl-step:last-child .line {
      display: none;
    }

    .tl-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      z-index: 1;
      font-weight: 700;
    }

    .tl-step.done .tl-dot {
      background: var(--green-600);
      box-shadow: 0 2px 8px rgba(34, 135, 91, 0.25);
    }

    .tl-step.done .line {
      background: var(--green-500);
    }

    .tl-step.current .tl-dot {
      background: var(--gold-500);
      box-shadow: 0 2px 8px rgba(228, 155, 44, 0.3);
    }

    .tl-label {
      font-weight: 700;
      font-size: 14px;
    }

    .tl-time {
      font-size: 12px;
      color: var(--ink-500);
      margin-top: 3px;
      font-weight: 500;
    }

    /* ---- Admin Shell (web + mobile responsive) ---- */
    .admin-shell {
      display: flex;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 260px;
      background: linear-gradient(180deg, var(--green-900) 0%, #082218 100%);
      color: #fff;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      overflow-y: auto;
    }

    .admin-sidebar.open {
      transform: translateX(0);
    }

    @media (min-width:900px) {
      .admin-sidebar {
        position: sticky;
        transform: translateX(0);
      }
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 24px;
    }

    .admin-brand .mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .admin-brand span {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15.5px;
    }

    .admin-nav button {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
      transition: all var(--transition-fast);
    }

    .admin-nav button .ic {
      font-size: 17px;
      width: 22px;
      text-align: center;
    }

    .admin-nav button:hover {
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.07);
    }

    .admin-nav button.active {
      background: linear-gradient(135deg, rgba(46, 165, 110, 0.2), rgba(255, 255, 255, 0.08));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .admin-nav .grp-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: rgba(255, 255, 255, 0.3);
      padding: 20px 14px 6px;
      font-weight: 700;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
    }

    .admin-topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    :root[data-theme="dark"] .admin-topbar { background: rgba(20, 31, 24, 0.88); }

  <div id="toast-wrap" class="toast-wrap"></div>
  <div id="app"></div>

  <!-- Firebase App, Cloud Firestore & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

  <!-- React 18 & ReactDOM for Dynamic Live Tracking Components -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Leaflet JS for Real-time Maps & Geolocation -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    (function () {
      "use strict";

      /* ================= CONSTANTS ================= */
      var LOW_STOCK_THRESHOLD = 8;
      var K = {
        USERS: 'sst_users', PRODUCTS: 'sst_products', CATEGORIES: 'sst_categories',
        ORDERS: 'sst_orders', NOTIFS: 'sst_notifications', SESSION: 'sst_session',
        SEEDED: 'sst_seeded_v1', COUNTER: 'sst_order_counter'
      };

      /* ================= GPS & GEOLOCATION CONSTANTS ================= */
      var DEFAULT_STORE_LOCATION = {
        lat: null,
        lng: null,
        name: "Aling Nena's Store",
        address: "Store GPS has not been set",
        isActualGps: false
      };

      function getStoreLocation() {
        var saved = dbGet('sst_store_location', null);
        if (saved && saved.isActualGps && Number.isFinite(saved.lat) && Number.isFinite(saved.lng)) {
          return saved;
        }
        return DEFAULT_STORE_LOCATION;
      }

      var STORE_LOCATION = getStoreLocation();

      function updateStoreLocationObject(newLoc) {
        if (!newLoc) return;
        STORE_LOCATION.lat = newLoc.lat;
        STORE_LOCATION.lng = newLoc.lng;

      function calcDistanceKm(lat1, lon1, lat2, lon2) {
        var R = 6371;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

              batch.set(docRef, JSON.parse(JSON.stringify(item)));

      var OSRM_CACHE = {};
      function fetchOSRMRoute(startLat, startLng, endLat, endLng, callback) {
        var key = [startLat.toFixed(5), startLng.toFixed(5), endLat.toFixed(5), endLng.toFixed(5)].join(';');
        if (OSRM_CACHE[key]) {
          callback(OSRM_CACHE[key]);
          return;
        }
        var url = 'https://router.project-osrm.org/route/v1/driving/' +
          startLng + ',' + startLat + ';' + endLng + ',' + endLat +
          '?overview=full&geometries=geojson';
        fetch(url)
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && data.code === 'Ok' && data.routes && data.routes.length > 0) {
              var r = data.routes[0];
              var latLngs = r.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
              var routeInfo = {
                latLngs: latLngs,
                distanceMeters: r.distance,
                distanceKm: r.distance / 1000,
                durationSec: r.duration,
                etaMinutes: Math.max(1, Math.ceil(r.duration / 60))
              };
              OSRM_CACHE[key] = routeInfo;
              callback(routeInfo);
            } else {
              throw new Error('No OSRM route found');
            }
          })
          .catch(function (err) {
            console.warn('Road route unavailable:', err);
            callback(null);
          });
      }

      /* ================= FIREBASE REALTIME LOCATION SHARING ================= */
      /* Delivery rider: 📱 GPS → Firebase Realtime Database → Customer */

      function publishRiderLocation(orderId, locData) {
        var payload = {
          orderId: orderId,
          latitude: locData.lat,
          longitude: locData.lng,
          lat: locData.lat,
          lng: locData.lng,
          accuracy: locData.accuracy || null,
          speed: locData.speed || null,
          heading: locData.heading || null,
          timestamp: locData.timestamp || new Date().toISOString(),
          riderName: locData.riderName || 'Store courier',
          status: locData.status || 'in_transit'
        };

        // 1. Firebase Realtime Database
        if (fbRtdb) {
          try {
            fbRtdb.ref('deliveries/' + orderId).set(payload).catch(function (err) {
              console.warn("[Firebase RTDB] write notice:", err.message);
            });
            fbRtdb.ref('rider_locations/' + orderId).set(payload).catch(function () { });
          } catch (e) { }
        }

        // 2. Cloud Firestore
        if (firestoreDb) {
          try {
            firestoreDb.collection('rider_locations').doc(orderId).set(payload, { merge: true }).catch(function (err) {
              console.warn("[Firestore] rider location write:", err.message);
            });
          } catch (e) { }
        }

        // 3. Local BroadcastChannel for instant inter-tab communication
        try {
          if (typeof BroadcastChannel !== 'undefined') {
            if (!window.sstRiderChannel) window.sstRiderChannel = new BroadcastChannel('sst_rider_gps');
            window.sstRiderChannel.postMessage({
              orderId: orderId,
              coords: payload
            });
          }
        } catch (e) { }

        // 4. LocalStorage
        try {
          localStorage.setItem('sst_rider_loc_' + orderId, JSON.stringify(payload));
        } catch (e) { }
      }

      function subscribeToRiderLocation(orderId, callback) {
        var unsubs = [];

        // 1. Firebase Realtime Database
        if (fbRtdb) {
          try {
            var rtdbRef = fbRtdb.ref('deliveries/' + orderId);
            var rtdbHandler = function (snap) {
              var val = snap.val();
              if (val && typeof val.latitude === 'number' && typeof val.longitude === 'number') {
                callback({
                  lat: val.latitude,
                  lng: val.longitude,
                  speed: val.speed,
                  heading: val.heading,
                  accuracy: val.accuracy,
                  timestamp: val.timestamp,
                  isSimulation: val.isSimulation,
                  riderName: val.riderName,
                  source: 'Firebase Realtime Database'
                });
              }
            };
            rtdbRef.on('value', rtdbHandler);
            unsubs.push(function () { rtdbRef.off('value', rtdbHandler); });
          } catch (e) { }
        }

        // 2. Cloud Firestore Real-time listener
        if (firestoreDb) {
          try {
            var unsubFs = firestoreDb.collection('rider_locations').doc(orderId)
              .onSnapshot(function (doc) {
                if (doc.exists) {
                  var d = doc.data();
                  if (d && typeof d.latitude === 'number' && typeof d.longitude === 'number') {
                    callback({
                      lat: d.latitude,
                      lng: d.longitude,
                      speed: d.speed,
                      heading: d.heading,
                      accuracy: d.accuracy,
                      timestamp: d.timestamp,
                      isSimulation: d.isSimulation,
                      riderName: d.riderName,
                      source: 'Cloud Firestore'
                    });
                  }
                }
              }, function (err) { });
            unsubs.push(unsubFs);
          } catch (e) { }
        }

        // 3. BroadcastChannel listener
        try {
          if (typeof BroadcastChannel !== 'undefined') {
            if (!window.sstRiderChannel) window.sstRiderChannel = new BroadcastChannel('sst_rider_gps');
            var bcHandler = function (e) {
              if (e.data && e.data.orderId === orderId && e.data.coords) {
                callback(Object.assign({}, e.data.coords, { source: 'BroadcastChannel' }));
              }
            };
            window.sstRiderChannel.addEventListener('message', bcHandler);
            unsubs.push(function () {
              if (window.sstRiderChannel) window.sstRiderChannel.removeEventListener('message', bcHandler);
            });
          }
        } catch (e) { }

        // 4. Initial cached location
        try {
          var cached = localStorage.getItem('sst_rider_loc_' + orderId);
          if (cached) {
            var parsed = JSON.parse(cached);
            if (parsed && Number.isFinite(parsed.lat) && Number.isFinite(parsed.lng)) {
              callback(Object.assign({}, parsed, { source: 'Local Cache' }));
            }
          }
        } catch (e) { }

        return function () {
          unsubs.forEach(function (fn) {
            try { fn(); } catch (e) { }
          });
        };
      }

      function hasStoreGps(store) {
        return !!(store && store.isActualGps && Number.isFinite(store.lat) && Number.isFinite(store.lng));
      }

      function isRecentLocation(loc) {
        if (!loc || loc.isSimulation || /Road Sim/i.test(loc.riderName || '') || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lng)) return false;
        var time = Date.parse(loc.timestamp);
        return Number.isFinite(time) && time <= Date.now() + 30000 && Date.now() - time <= 120000;
      }

      var activeRiderWatchId = null;
      var activeRiderWatchingOrderId = null;

      function startRiderDeviceGps(orderId) {
        var order = getOrders().filter(function (o) { return o.id === orderId; })[0];
        if (!order || order.status !== 'Out for Delivery') {
          toast('Mark the order Out for Delivery before sharing rider GPS.');
          return false;
        }
        if (!navigator.geolocation) {
          toast('Geolocation is not supported on this device.');
          return false;
        }
        stopRiderDeviceGps();
        activeRiderWatchingOrderId = orderId;
        activeRiderWatchId = navigator.geolocation.watchPosition(function (pos) {
          if (pos.coords.accuracy > 200) return;
          var loc = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            speed: pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : null,
            heading: pos.coords.heading || null,
            accuracy: Math.round(pos.coords.accuracy || 10),
            timestamp: new Date().toISOString(),
            isLivePhoneGps: true,
            riderName: "Express Courier (Phone GPS)"
          };
          publishRiderLocation(orderId, loc);
        }, function (err) {
          console.warn("[Rider Phone GPS] watch error:", err);
          toast('Rider GPS unavailable: ' + (err.message || 'location error'));
          stopRiderDeviceGps();
        }, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
        toast('📱 Phone GPS streaming active for Order ' + (orderId ? orderId.slice(-4) : ''));
        return true;
      }

      function stopRiderDeviceGps() {
        if (activeRiderWatchId !== null) {
          navigator.geolocation.clearWatch(activeRiderWatchId);
          activeRiderWatchId = null;
          activeRiderWatchingOrderId = null;
          toast('Rider GPS streaming stopped.');
        }
      }

          return function () {

      /* ================= CHECKOUT MAP INITIALIZER ================= */
      function initCheckoutMap() {
        var container = document.getElementById('checkout-map');
        if (!container || typeof L === 'undefined') return;
        destroyMap('checkout');

        var user = currentUser();
        var store = getStoreLocation();
        var defaultPos = state.checkoutCoords ? [state.checkoutCoords.lat, state.checkoutCoords.lng] : (hasStoreGps(store) ? [store.lat, store.lng] : [0, 0]);

        var map = L.map(container, {
          center: defaultPos,
          zoom: state.checkoutCoords || hasStoreGps(store) ? 16 : 2,
          zoomControl: false,
          attributionControl: false
        });
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        createOsmTileLayer().addTo(map);

        // Store marker
        if (hasStoreGps(store)) L.marker([store.lat, store.lng], { icon: createStoreIcon() }).addTo(map)
          .bindPopup('<b>' + esc(store.name) + '</b><br>Store GPS location');

        // Draggable customer pin
        var custMarker = L.marker(defaultPos, {
          draggable: true,
          icon: createCustomerIcon(user ? user.fullName : 'Delivery Point', null, true)
        });
        if (state.checkoutCoords) custMarker.addTo(map);

        custMarker.bindPopup('📍 Drag to your exact gate or tap "Detect My GPS"');

        var routeLine = null;
        var routeRequest = 0;
        function updateRoute(destLat, destLng) {
          if (!hasStoreGps(store)) return;
          var request = ++routeRequest;
          fetchOSRMRoute(store.lat, store.lng, destLat, destLng, function (rInfo) {
            if (!activeMaps.checkout || request !== routeRequest) return;
            if (routeLine) {
              activeMaps.checkout.removeLayer(routeLine);
              routeLine = null;
            }
            if (!rInfo) return;
            routeLine = L.polyline(rInfo.latLngs, {
              color: '#2DA56E',
              weight: 4,
              opacity: 0.85,
              dashArray: '6, 6'
            }).addTo(activeMaps.checkout);
          });
        }

        if (state.checkoutCoords) updateRoute(defaultPos[0], defaultPos[1]);

        var accuracyCircle = null;
        if (state.checkoutCoords && state.checkoutCoords.accuracy) {
          accuracyCircle = L.circle(defaultPos, {
            radius: Math.min(100, state.checkoutCoords.accuracy),
            color: '#2DA56E',
            fillColor: '#2DA56E',
            fillOpacity: 0.15,
            weight: 1.5
          }).addTo(map);
        }

        function onPosChange(newLat, newLng, isManual) {
          state.checkoutCoords = {
            lat: newLat,
            lng: newLng,
            accuracy: isManual ? null : (state.checkoutCoords ? state.checkoutCoords.accuracy : null),
            manual: isManual,
            timestamp: new Date().toISOString()
          };
          custMarker.setLatLng([newLat, newLng]);
          if (!map.hasLayer(custMarker)) custMarker.addTo(map);
          if (accuracyCircle && isManual) {
            map.removeLayer(accuracyCircle);
            accuracyCircle = null;
          }
          updateRoute(newLat, newLng);
          updateCheckoutGpsUi();
        }

        custMarker.on('dragend', function (e) {
          var pos = e.target.getLatLng();
          onPosChange(pos.lat, pos.lng, true);
        });

        map.on('click', function (e) {
          onPosChange(e.latlng.lat, e.latlng.lng, true);
        });

        activeMaps.checkout = map;
        activeMaps.checkoutMarker = custMarker;
        activeMaps.checkoutAccuracy = accuracyCircle;
        activeMaps.checkoutUpdateRoute = updateRoute;

        setTimeout(function () {
          if (activeMaps.checkout) activeMaps.checkout.invalidateSize();
        }, 120);

        // If customer hasn't locked GPS yet, trigger automatic detection prompt
        if (!state.checkoutCoords && navigator.geolocation) {
          App.detectCustomerGps(false);
        }
      }

      function updateCheckoutGpsUi() {
        var el = document.getElementById('checkout-gps-status');
        if (!el) return;
        var coords = state.checkoutCoords;
        var store = getStoreLocation();
        if (!coords) {
          el.innerHTML = '<span class="gps-badge-pill searching">📍 Detect GPS or tap the map</span><span>No drop-off location selected</span>';
          return;
        }
        var dist = hasStoreGps(store) ? calcDistanceKm(store.lat, store.lng, coords.lat, coords.lng) : null;
        var distStr = dist === null ? 'Store GPS not set' : (dist < 1 ? Math.round(dist * 1000) + 'm from store' : dist.toFixed(2) + ' km from store');
        if (coords.manual) {
          el.innerHTML = '<span class="gps-badge-pill manual">📍 Pin Set on Map</span><span>' + distStr + ' &middot; ' + coords.lat.toFixed(5) + ', ' + coords.lng.toFixed(5) + '</span>';
        } else {
          var acc = coords.accuracy ? ' (~' + coords.accuracy + 'm accuracy)' : '';
          el.innerHTML = '<span class="gps-badge-pill locked"><span class="cloud-dot"></span> GPS Locked' + acc + '</span><span>' + distStr + '</span>';
        }
      }
